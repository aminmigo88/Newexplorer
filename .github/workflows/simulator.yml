name: iPhone simulator
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: macos-15
    # The first build of Open CASCADE takes about an hour; after that it comes from the cache.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      # Open CASCADE (the STEP and IGES reader's library) is built once per version of Scripts/build_occt.sh and kept
      # in the Actions cache. It's saved right after building, so a later failing step doesn't lose it.
      - name: Restore Open CASCADE
        id: occt
        uses: actions/cache/restore@v4
        with:
          path: Vendor/occt
          key: occt-${{ hashFiles('Scripts/build_occt.sh') }}
      - name: Build Open CASCADE for iPhone and simulator
        if: steps.occt.outputs.cache-hit != 'true'
        run: bash Scripts/build_occt.sh
      - name: Save Open CASCADE
        if: steps.occt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Vendor/occt
          key: ${{ steps.occt.outputs.cache-primary-key }}
      - name: Pick an installed iPhone simulator
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; runtimes=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime,devices in reversed(list(runtimes.items())) if "iOS-" in runtime for d in devices if d["name"].startswith("iPhone") and d["isAvailable"]))')
          echo "SIMULATOR_ID=$device" >> "$GITHUB_ENV"
      - name: Test the app
        run: |
          xcodebuild -quiet build-for-testing -project Newexplorer.xcodeproj -scheme Newexplorer \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO
          bash Scripts/prepare_picker_test.sh build/simulator/Build/Products/Debug-iphonesimulator/Newexplorer.app "$SIMULATOR_ID"
          status=0
          TEST_RUNNER_FILES_FIXTURE=1 xcodebuild -quiet test-without-building -derivedDataPath build/simulator -project Newexplorer.xcodeproj -scheme Newexplorer \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath SimulatorTests.xcresult -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO || status=$?
          xcrun xcresulttool get test-results activities --path SimulatorTests.xcresult \
            --test-id 'LocationChoiceTests/testSystemFilesPickerDeliversSingleFile()' \
            | grep -o '"title" : "[^"]*"' | grep -E 'Added folder|while adding|not delivered|Back to On My iPhone|Picking|Open button|Picker still|Step:' || true
          # The Photos integration test can hang in the simulator. The Files test marks
          # only its known system-picker delivery failure as expected.
          xcrun xcresulttool get test-results summary --path SimulatorTests.xcresult | STATUS="$status" python3 -c '
          import json, os, sys
          result = json.load(sys.stdin)
          reported = {"LocationChoiceTests/testPhotoFoldersViewerSwipeInfoSendAndArchives()"}
          failed = {f["testIdentifierString"] for f in result.get("testFailures", [])}
          for test in sorted(failed & reported):
              print("::warning::" + test + " failed in the simulator; it does not block the build.")
          assert failed <= reported, ("Failed tests", sorted(failed - reported))
          assert result["skippedTests"] == 0, result
          import pathlib, re
          expected = sum(len(re.findall(r"\bfunc test\w*\(", p.read_text())) for folder in ["Tests", "UITests"] for p in pathlib.Path(folder).glob("*.swift"))
          assert result["passedTests"] + result.get("expectedFailures", 0) + len(failed) >= expected, result
          assert os.environ["STATUS"] == "0" or failed, ("Tests stopped without a failed test", result)
          '
      - name: Save simulator results
        if: always() && hashFiles('SimulatorTests.xcresult/Info.plist') != ''
        uses: actions/upload-artifact@v4
        with:
          name: SimulatorTests
          path: SimulatorTests.xcresult
          retention-days: 7
      - name: Report simulator test failures
        if: failure()
        run: |
          if [ -d SimulatorTests.xcresult ]; then
            xcrun xcresulttool get test-results summary --path SimulatorTests.xcresult
            # The steps each failed test went through, so the report shows where it stopped.
            failed=$(xcrun xcresulttool get test-results summary --path SimulatorTests.xcresult \
              | python3 -c 'import json,sys; print("\n".join(f["testIdentifierString"] for f in json.load(sys.stdin).get("testFailures", [])))')
            for id in $failed; do
              echo "== Steps of $id"
              xcrun xcresulttool get test-results activities --path SimulatorTests.xcresult --test-id "$id" \
                | grep -o '"title" : "[^"]*"' | grep -vE 'Synthesize|Wait for|Find the|Check for|Requesting snapshot|Get all elements|Snapshot accessibility' | tail -40 || true
            done
          fi
      - name: Build unsigned iPhone app
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev/v0.12.0'
        env:
          # The App ID of your signing profile, kept in the repository secret BUNDLE_ID (README, Signing).
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
        run: |
          if [ -n "$BUNDLE_ID" ]; then
            python3 Scripts/generate_project.py
          else
            echo "::warning::The BUNDLE_ID secret is not set, so the IPA has the placeholder bundle ID com.example.newexplorer. Set it to the App ID of your signing profile (README, Signing)."
          fi
          xcodebuild -quiet build -project Newexplorer.xcodeproj -scheme Newexplorer \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO
      - name: Package and validate IPA
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev/v0.12.0'
        env:
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
        run: python3 Scripts/package_ipa.py
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev/v0.12.0'
        with:
          name: Newexplorer-v0.12.0-unsigned
          path: |
            output/*.ipa
            output/SHA256.txt
          if-no-files-found: error
